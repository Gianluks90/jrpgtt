<div
    class="map-grid"
    [style.gridTemplateColumns]="'repeat(' + mapSize() + ', 1fr)'"
    [style.gridTemplateRows]="'repeat(' + mapSize() + ', 1fr)'"
    [style.--map-size]="mapSize()"
>
    <div class="sector-guides" aria-hidden="true">
        <span class="sector-divider sector-divider-first"></span>
        <span class="sector-divider sector-divider-second"></span>

        <span class="sector-line sector-line-top sector-line-first"></span>
        <span class="sector-line sector-line-top sector-line-second"></span>
        <span class="sector-line sector-line-bottom sector-line-first"></span>
        <span class="sector-line sector-line-bottom sector-line-second"></span>

        <span class="sector-label sector-label-first">I</span>
        <span class="sector-label sector-label-second">II</span>
        <span class="sector-label sector-label-third">III</span>

        @if (regionBoundaryWarningOverlay(); as warning) {
            <span
                class="region-transition-warning-line"
                [style.left.%]="warning.leftPercent"
                [style.top.%]="warning.topPercent"
                [style.--warning-cell-height]="warning.cellHeightPercent + '%'"
            ></span>
        }
    </div>

    <div class="quadrant-influence-layer" aria-hidden="true">
        @for (overlay of quadrantInfluenceOverlays(); track overlay.id) {
            <span
                class="quadrant-influence-overlay"
                [style.left]="'calc((100% / var(--map-size, 10)) * ' + overlay.startX + ')'"
                [style.top]="'calc((100% / var(--map-size, 10)) * ' + overlay.startY + ')'"
                [style.width]="'calc((100% / var(--map-size, 10)) * ' + overlay.size + ')'"
                [style.height]="'calc((100% / var(--map-size, 10)) * ' + overlay.size + ')'"
                [style.--influence-border-color]="overlay.borderColor"
                [style.--influence-glow-color]="overlay.glowColor"
            ></span>
        }
    </div>

    <div class="fast-travel-layer" aria-hidden="true">
        @if (fastTravelLineOverlay(); as line) {
            <span
                class="fast-travel-line"
                [style.left.%]="line.left"
                [style.top.%]="line.top"
                [style.width.%]="line.width"
                [style.--fast-travel-color]="line.color"
                [style.transform]="'translateY(-50%) rotate(' + line.angleDeg + 'deg)'"
            ></span>
        }

        @if (fastTravelMarkerOverlay(); as marker) {
            <span
                class="fast-travel-marker"
                [style.left.%]="marker.left"
                [style.top.%]="marker.top"
                [style.--fast-travel-color]="marker.color"
            ></span>
        }
    </div>

    @for (cell of cells(); track cell.id) {
        <map-cell
            [special]="cell.isSpecial"
            [specialType]="specialTypeForCell(cell)"
            [revealed]="isRevealedCell(cell)"
            [movable]="isMovableCell(cell)"
            [hoveredEnvironment]="isHoveredEnvironmentCell(cell)"
            [dangerOverlayLevel]="dangerOverlayLevel(cell)"
            [biome]="cell.mapCell?.biome ?? null"
            [sanctuaryStyle]="sanctuaryStyleForCell(cell)"
            [landmarkIconUrl]="landmarkIconUrlForCell(cell)"
            [players]="cell.players"
            [activePlayerId]="activePlayerId()"
            [envTopWidth]="environmentBorderWidth(cell, 'top')"
            [envRightWidth]="environmentBorderWidth(cell, 'right')"
            [envBottomWidth]="environmentBorderWidth(cell, 'bottom')"
            [envLeftWidth]="environmentBorderWidth(cell, 'left')"
            [hoverIntentProgress]="hoverIntentProgressForCell(cell)"
            (cellClicked)="cellClicked.emit(cell)"
            (cellEntered)="onCellEnter(cell)"
            (cellLeft)="onCellLeave(cell)"
        ></map-cell>
    }
</div>
