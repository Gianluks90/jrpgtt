<div class="world-state-panel-root">
	@if (showTitle()) {
		<p class="hud-title" [class.mobile-sidebar-title]="mobileSidebarTitle()">{{ title() }}</p>
	}

	<p class="world-summary-line">
		@for (entry of worldSummaryEntries(); track entry.label) {
			<span class="world-summary-entry">
				<span class="world-summary-label">{{ entry.label }}</span>
				<strong class="world-summary-value" [class.flashing-text]="entry.isActivePlayer">{{ entry.value }}</strong>
			</span>
		}
	</p>
</div>
