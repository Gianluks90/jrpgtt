<dialog-wrapper [title]="title" [luckResult]="luckMeterResult" [luckAnimateFirstResult]="true">
    <p class="info-text">
        {{ 'dialogs.graveyardResult.attemptedFor' | t: { follower: selectedFollowerLabel } }}
    </p>

    <div class="reward-table">
        @for (row of rewardsTable; track row.id) {
            <div class="reward-row" [class.reward-row--highlighted]="isHighlighted(row)">
                <span class="reward-range">{{ row.rangeLabel }}</span>
                <span class="reward-effect">{{ row.effectLabel }}</span>
            </div>
        }
    </div>

    <p class="result-text">
        {{ 'dialogs.graveyardResult.result' | t }} <strong>{{ rewardLabel }}</strong>
    </p>

    <text-button dialog-action [text]="'dialogs.graveyardResult.continue' | t" (clicked)="continue()"></text-button>
</dialog-wrapper>
