<dialog-wrapper [title]="title">
    <div dialog-header-extra class="header-money">
        <span>{{ playerMoney }}</span>
        <span class="coin-icon" aria-hidden="true"></span>
    </div>

    <p class="info-text">{{ description }}</p>
    <p class="info-text sanctuary-element">{{ 'dialogs.sanctuary.element' | t: { element: sanctuaryLabel } }}</p>

    <form [formGroup]="form">
        <div class="form-field">
            <label for="donatedCoins">{{ 'dialogs.sanctuary.donationAmount' | t }}</label>
            <input
                id="donatedCoins"
                type="number"
                inputMode="numeric"
                formControlName="donatedCoins"
                [min]="donationCost"
                [max]="donationCost"
                [placeholder]="'dialogs.sanctuary.placeholder' | t: { cost: donationCost }"
            />
            <p class="info-text donate-cost-row">
                <span>{{ 'dialogs.sanctuary.mustDonateExactly' | t }}</span>
                <span class="spend-tag">
                    <span>-{{ donationCost }}</span>
                    <span class="coin-icon spend-tag-icon" aria-hidden="true"></span>
                </span>
            </p>
        </div>
    </form>

    @if (donationDisabled) {
        <p class="error-text">{{ 'dialogs.sanctuary.errors.notEnoughCoins' | t }}</p>
    }

    <text-button
        dialog-action
        [text]="confirmLabel"
        [disabled]="form.invalid || donationDisabled"
        (clicked)="confirm()"
    ></text-button>
    <text-button dialog-action [text]="'dialogs.common.cancel' | t" (clicked)="close()"></text-button>
</dialog-wrapper>
