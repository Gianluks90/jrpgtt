<dialog-wrapper [title]="title">
    <div dialog-header-extra class="header-money">
        <span>{{ playerMoney }}</span>
        <span class="coin-icon" aria-hidden="true"></span>
    </div>

    <p class="info-text">{{ description }}</p>
    <p class="info-text sanctuary-element">Sanctuary element: <strong>{{ sanctuaryLabel }}</strong></p>

    <form [formGroup]="form">
        <div class="form-field">
            <label for="donatedCoins">Donation amount</label>
            <input
                id="donatedCoins"
                type="number"
                inputMode="numeric"
                formControlName="donatedCoins"
                [min]="donationCost"
                [max]="donationCost"
                [placeholder]="'Type ' + donationCost"
            />
            <p class="info-text donate-cost-row">
                <span>You must donate exactly:</span>
                <span class="spend-tag">
                    <span>-{{ donationCost }}</span>
                    <span class="coin-icon spend-tag-icon" aria-hidden="true"></span>
                </span>
            </p>
        </div>
    </form>

    @if (donationDisabled) {
        <p class="error-text">You do not have enough coins for this action.</p>
    }

    <text-button
        dialog-action
        [text]="confirmLabel"
        [disabled]="form.invalid || donationDisabled"
        (clicked)="confirm()"
    ></text-button>
    <text-button dialog-action text="Cancel" (clicked)="close()"></text-button>
</dialog-wrapper>
