<dialog-wrapper title="Player Setup">
    <p class="info-text">
        Set your player name and distribute all starting experience points before marking your player as ready.
    </p>

    <form [formGroup]="form">
        <div class="form-field">
            <label for="name">Name</label>
            <input id="name" formControlName="name" type="text" placeholder="Enter text" />
            <p class="info-text">* Maximum 8 characters</p>
        </div>
    </form>

    <div class="pool-box">
        <span class="info-text">Experience pool</span>
        <span class="pool-value" [class.pool-empty]="experience === 0">{{ experience }}</span>
    </div>

    <div class="alignment-box" [class.invalid]="form.controls['alignment'].invalid && form.controls['alignment'].touched">
        <span class="info-text">Alignment</span>
        <div class="alignment-options" role="radiogroup" aria-label="Player alignment">
            @for (alignment of alignments; track alignment) {
                <button
                    type="button"
                    class="alignment-option"
                    [class.is-active]="form.controls['alignment'].value === alignment"
                    [class.good]="alignment === 'good'"
                    [class.neutral]="alignment === 'neutral'"
                    [class.evil]="alignment === 'evil'"
                    [attr.aria-pressed]="form.controls['alignment'].value === alignment"
                    (click)="form.controls['alignment'].setValue(alignment)"
                >
                    <span class="alignment-icon" [style.mask]="'url(/alignment-icons/' + alignment + '-icon.svg) no-repeat center / contain'"></span>
                    <span class="alignment-label">{{ alignment }}</span>
                </button>
            }
        </div>
    </div>

    <div class="parameter-row">
        <span class="parameter-name">Strength</span>
        <button type="button" class="param-btn" [disabled]="!canDecrease('strength')" (click)="decreaseParameter('strength')">-</button>
        <span class="param-value">{{ strength }}</span>
        <button type="button" class="param-btn" [disabled]="!canIncrease()" (click)="increaseParameter('strength')">+</button>
    </div>

    <div class="parameter-row">
        <span class="parameter-name">Magic</span>
        <button type="button" class="param-btn" [disabled]="!canDecrease('magic')" (click)="decreaseParameter('magic')">-</button>
        <span class="param-value">{{ magic }}</span>
        <button type="button" class="param-btn" [disabled]="!canIncrease()" (click)="increaseParameter('magic')">+</button>
    </div>

    <div class="parameter-row">
        <span class="parameter-name">Luck</span>
        <button type="button" class="param-btn" [disabled]="!canDecrease('luck')" (click)="decreaseParameter('luck')">-</button>
        <span class="param-value">{{ luck }}</span>
        <button type="button" class="param-btn" [disabled]="!canIncrease()" (click)="increaseParameter('luck')">+</button>
    </div>

    <text-button dialog-action text="Ready" (clicked)="confirm()" [disabled]="!canConfirm()"></text-button>
    <text-button dialog-action text="Cancel" (clicked)="close()"></text-button>
</dialog-wrapper>
