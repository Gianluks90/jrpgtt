<dialog-wrapper [title]="'dialogs.genericDelete.title' | t">
    <p class="info-text">
        {{ 'dialogs.genericDelete.message' | t }}
    </p>
    <text-button dialog-action [text]="'dialogs.genericDelete.confirm' | t" (clicked)="confirm()"></text-button>
    <text-button dialog-action [text]="'dialogs.common.cancel' | t" (clicked)="close()"></text-button>
</dialog-wrapper>
