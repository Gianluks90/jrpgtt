<dialog-wrapper title="Level Up">
    <p class="info-text">You reached level {{ level }}.</p>
    <p class="info-text">Choose one parameter to increase by 1.</p>
    <p class="info-text">Remaining experience after level-up: {{ experience }}</p>

    <form [formGroup]="form" (submit)="$event.preventDefault()">
        <div class="choices" role="radiogroup" aria-label="Characteristic to increase">
            @for (option of options; track option.value) {
            <label class="choice-card" [class.selected]="isSelected(option.value)" [attr.for]="option.value">
                <input [id]="option.value" class="choice-input" type="radio" formControlName="characteristic"
                    [value]="option.value" />
                <span class="choice-label">{{ option.label }}</span>
                <span class="choice-description">{{ option.description }}</span>
            </label>
            }
        </div>
    </form>

    <text-button dialog-action text="Confirm" [disabled]="!form.valid" (clicked)="confirm()"></text-button>
</dialog-wrapper>
