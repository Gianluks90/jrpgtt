<dialog-wrapper [title]="'dialogs.levelUp.title' | t">
    <p class="info-text">{{ 'dialogs.levelUp.reachedLevel' | t: { level: level } }}</p>
    <p class="info-text">{{ 'dialogs.levelUp.chooseOne' | t }}</p>
    <p class="info-text">{{ 'dialogs.levelUp.remainingExperience' | t: { experience: experience } }}</p>

    <form [formGroup]="form" (submit)="$event.preventDefault()">
        <div class="choices" role="radiogroup" [attr.aria-label]="'dialogs.levelUp.ariaCharacteristic' | t">
            @for (option of options; track option.value) {
            <label class="choice-card" [class.selected]="isSelected(option.value)" [attr.for]="option.value">
                <input [id]="option.value" class="choice-input" type="radio" formControlName="characteristic"
                    [value]="option.value" />
                <span class="choice-label">{{ option.label }}</span>
                <span class="choice-description">{{ option.description }}</span>
            </label>
            }
        </div>
    </form>

    <text-button dialog-action [text]="'dialogs.common.confirm' | t" [disabled]="!form.valid" (clicked)="confirm()"></text-button>
</dialog-wrapper>
