<div class="biomes-counter-root">
  @for (biome of biomeOrder; track biome) {
    <div class="biome-counter-item" [class]="'biome-counter-item biome-' + biome">
      <span class="biome-swatch" aria-hidden="true"></span>
      <strong class="biome-count">{{ countBiome(biome) }}</strong>
    </div>
  }

  <div
    class="biome-counter-item biome-special"
    (mouseenter)="onSpecialCounterEnter()"
    (mouseleave)="onSpecialCounterLeave()"
  >
    <span class="biome-swatch" aria-hidden="true">
      <span class="biome-swatch-icon"></span>
    </span>
    <strong class="biome-count">{{ countSpecialLocations() }}</strong>
  </div>

  <div class="decks-block">
    <div class="deck-counter-group">
      <app-exploration-card-back size="map-cell" variant="deck" aria-hidden="true"></app-exploration-card-back>
      <strong class="biome-count">{{ explorationDeckCount() }}</strong>
    </div>

    <div class="deck-counter-group">
      <app-spell-card-back size="map-cell" aria-hidden="true"></app-spell-card-back>
      <strong class="biome-count">{{ spellDeckCount() }}</strong>
    </div>
    
    <button class="deck-counter-group deck-counter-discard" (click)="onDiscardPileClicked()">
      <app-exploration-card-back size="map-cell" variant="discard" aria-hidden="true"></app-exploration-card-back>
      <strong class="biome-count">{{ discardPileCount() }}</strong>
    </button>

  </div>
</div>
