<div class="commands-panel-root">
	<div class="commands-list">
		@for (action of actions(); track action.id) {
			<button
				type="button"
				class="command-card"
				[disabled]="action.disabled || action.pending"
				(click)="onActionClick(action)"
			>
				<span class="command-card-header">
					<span class="command-card-title">
						@if (action.pending) {
							Executing...
						} @else {
							{{ action.label }}
						}
					</span>
					@if (action.moneyCost !== undefined) {
						<span class="command-card-money">
							@if (action.moneyCost !== null) {
								<span class="command-card-money-value">{{ action.moneyCost }}</span>
							}
							<span class="coin-icon command-card-money-icon" aria-hidden="true"></span>
						</span>
					}
				</span>
				<span class="command-card-divider" aria-hidden="true"></span>
				<span class="command-card-description">{{ action.description || '-' }}</span>
				@if (action.warning) {
					<span class="command-card-warning">{{ action.warning }}</span>
				}
			</button>
		}

		@if (actions().length === 0) {
			<p class="commands-empty-state">No actions available for this position.</p>
		}
	</div>
</div>
