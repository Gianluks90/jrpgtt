<div class="dialog-wrapper-container">
    <div class="dialog-wrapper-header">
        <h1>{{title()}}</h1>
        <div class="dialog-wrapper-header-extra">
            <ng-content select="[dialog-header-extra]"></ng-content>
        </div>
    </div>
    <div class="dialog-wrapper-content">
        @if (luckResult() !== undefined) {
            <app-luck-indicator
                class="dialog-wrapper-luck-meter"
                [result]="luckResult() ?? null"
                [animateFirstResult]="luckAnimateFirstResult()"
            ></app-luck-indicator>
        }
        <ng-content></ng-content>
    </div>
    @if (!hideActions()) {
    <div class="dialog-wrapper-actions">
        <ng-content select="[dialog-action]"></ng-content>
    </div>
    }
</div>
