<div
    class="map-cell"
    [class.special-cell]="special()"
    [class.sanctuary-cell]="isSanctuaryCell()"
    [class.landmark-cell]="isLandmarkCell()"
    [class.revealed-cell]="revealed()"
    [class.desaturated-cell]="desaturated()"
    [class.unrevealed-cell]="!revealed()"
    [class.movable-cell]="movable()"
    [class.impassable-cell]="impassable()"
    [class.environment-hover-cell]="hoveredEnvironment()"
    [class]="biome() && !isSanctuaryCell() ? 'biome-' + biome() : ''"
    [style.--env-top-width]="envTopWidth()"
    [style.--env-right-width]="envRightWidth()"
    [style.--env-bottom-width]="envBottomWidth()"
    [style.--env-left-width]="envLeftWidth()"
    [style.--sanctuary-icon]="sanctuaryStyle()?.iconUrl ? 'url(' + sanctuaryStyle()?.iconUrl + ')' : null"
    [style.--sanctuary-bg-color]="sanctuaryStyle()?.backgroundColor ?? null"
    [style.--sanctuary-icon-color]="sanctuaryStyle()?.iconColor ?? null"
    [style.--landmark-icon]="landmarkIconUrl() ? 'url(' + landmarkIconUrl() + ')' : null"
    (click)="onClick()"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
>
    @if (hoverIntentProgress() > 0 && hoverIntentProgress() < 100) {
        <div class="hover-intent-progress" [style.width.%]="hoverIntentProgress()"></div>
    }

    @if (revealed() && dangerOverlayLevel() > 0) {
        <div
            class="danger-overlay"
            [class.danger-overlay-strong]="dangerOverlayLevel() === 2"
        ></div>
    }

    @if (revealed() && impassable()) {
        <div class="impassable-cross" aria-hidden="true"></div>
    }

    @if (players().length > 0) {
        <div class="player-marker-cluster">
            <div class="player-marker flashing-text" [style.--marker-color]="markerColor()"></div>
            @if (extraPlayersCount() > 0) {
                <div class="player-count-badge">+{{ extraPlayersCount() }}</div>
            }
        </div>
    }
</div>
