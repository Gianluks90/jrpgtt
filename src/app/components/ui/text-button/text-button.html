<button class="text-button" [class.full-width]="fullWidth()" (click)="handleClick()" [disabled]="disabled()">
    @if (iconUrl()) {
        <span class="button-icon" [style.mask]="'url(' + iconUrl() + ') no-repeat center / contain'"></span>
    }
    <span class="button-text">{{ text() }}</span>
</button>
