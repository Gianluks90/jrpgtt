<div
  class="ui-tooltip"
  (mouseenter)="onMouseEnter($event)"
  (mousemove)="onMouseMove($event)"
  (mouseleave)="onMouseLeave()"
>
  <div #tooltipTrigger class="ui-tooltip-trigger">
    <ng-content select="[tooltipTrigger]"></ng-content>
  </div>

  @if (isVisible()) {
    <div #tooltipPanel class="ui-tooltip-panel" role="tooltip" [style.left.px]="panelLeft()" [style.top.px]="panelTop()">
      <div class="ui-tooltip-title">{{ title() }}</div>
      <div class="ui-tooltip-body">
        <ng-content select="[tooltipContent]"></ng-content>
      </div>
    </div>
  }
</div>
