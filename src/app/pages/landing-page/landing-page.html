<div class="landing-page-main-container">
    <div class="top-controls">
        <sound-toggle-button></sound-toggle-button>
        <crt-toggle-button></crt-toggle-button>
        <language-menu class="top-language-menu"></language-menu>
    </div>

    <h1 class="app-title">Amulet</h1>
    <p class="landing-tagline">{{ 'landing.tagline' | t }}</p>

    <div class="bottom-login-container">
        <text-button

            iconUrl="./icons/login_20dp_E3E3E3_FILL1_wght400_GRAD-25_opsz20.svg"
            [fullWidth]="true"
            (clicked)="handleLogin()"
        ></text-button>
        <p class="info-text">{{ 'landing.googleRequired' | t }}</p>
    </div>
</div>
