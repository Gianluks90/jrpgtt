<div class="map-page-main-container">
    <div class="page-shell">
        <div class="hud hud-world world-header">
            <app-world-state-panel
                [worldState]="worldState()"
                [players]="players()"
                [mapCellsById]="mapCellsById()"
                [mapSize]="mapSize()"
                [totalSpecialCells]="4"
                [showTitle]="true"
                title="World"
            ></app-world-state-panel>
        </div>

        <div class="map-stage">
            <aside class="stage-sidebar">
                <app-map-players-panel
                    [myPlayer]="myPlayer()"
                    [myPlayerComputedStats]="myPlayerComputedStats()"
                    [players]="players()"
                    [activePlayerId]="worldState()?.activePlayerId ?? null"
                    [pendingLevelUpChoices]="pendingLevelUpChoices()"
                    [canOpenLevelUpDialog]="canOpenLevelUpDialog()"
                    (openLevelUpRequested)="onOpenLevelUpDialog()"
                ></app-map-players-panel>

                <section class="hud sidebar-block commands-block">
                    <p class="hud-title">Commands</p>
                    <app-commands-panel
                        [actions]="commandActions()"
                        (actionRequested)="onCommandActionRequested($event)"
                    ></app-commands-panel>
                </section>

                <app-luck-indicator class="sidebar-luck-meter" [result]="myPlayer()?.lastLuckCheck || null"></app-luck-indicator>
            </aside>

            <div class="map-wrapper">
                <div class="map-center-shell">
                    <app-map-grid-panel
                        [mapSize]="mapSize()"
                        [mapCellsById]="mapCellsById()"
                        [players]="players()"
                        [activePlayerId]="worldState()?.activePlayerId ?? null"
                        [movableCellIds]="movableCellIds()"
                        [sanctuaryStylesByElement]="sanctuaryStylesByElement()"
                        [environmentByCellId]="environmentByCellId()"
                        (cellClicked)="onCellClick($event)"
                        (inspectedCellChanged)="onInspectionCellChanged($event)"
                    ></app-map-grid-panel>
                    <app-biomes-counter class="map-floating-biomes-counter" [worldState]="worldState()"></app-biomes-counter>
                </div>
            </div>

            <aside class="stage-right-utilities">
                <app-resource-counter
                    [resources]="myPlayer()?.inventory?.resources || []"
                    [currentCount]="resourceCount()"
                    [maxCount]="resourceCapacity()"
                    (panelClicked)="onResourcePanelClicked()"
                ></app-resource-counter>
                <app-money-counter [money]="myPlayer()?.inventory?.money || 0"></app-money-counter>
                <app-alignment-indicator [alignment]="myPlayer()?.alignment ?? 'neutral'"></app-alignment-indicator>
                <app-attunement-indicator [element]="myPlayer()?.attunedElement ?? null"></app-attunement-indicator>

                <app-map-cell-inspector-panel
                    [inspectedCell]="inspectedCell()"
                    [activePlayer]="activePlayer()"
                    [players]="players()"
                    [mapCellsById]="mapCellsById()"
                    [mapSize]="mapSize()"
                    [environmentByCellId]="environmentByCellId()"
                    [biomeResourcesByBiome]="biomeResourcesByBiome()"
                    [sanctuaryStylesByElement]="sanctuaryStylesByElement()"
                ></app-map-cell-inspector-panel>

                <app-day-night-cycle-panel [worldState]="worldState()"></app-day-night-cycle-panel>
            </aside>
        </div>

        <div class="footer-actions">
            <app-map-log-panel
                [latestMessage]="latestLogMessage()"
                (openLogsRequested)="openLogsDialog()"
            ></app-map-log-panel>
            <icon-button
                class="footer-home-button"
                iconUrl="./icons/home_20dp_E3E3E3_FILL1_wght400_GRAD0_opsz20.svg"
                ariaLabel="Home"
                (clicked)="onBackHome()"
            ></icon-button>
        </div>
    </div>
</div>
