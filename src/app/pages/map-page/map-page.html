<div class="map-page-main-container">
    <div class="page-shell">
        @if (!isMobile()) {
            <div class="hud hud-players players-header">
                <p class="hud-title">Players</p>
                <div class="player-list">
                    @for (player of players(); track trackPlayer($index, player)) {
                        <app-player-card
                            [player]="player"
                            [highlighted]="worldState()?.activePlayerId === player.id"
                        ></app-player-card>
                    }
                </div>
            </div>

            <div class="map-stage">
                <aside class="hud hud-world stage-sidebar">
                    <p class="hud-title">World</p>
                    <div class="panel-scroll-body">
                        <app-world-state-panel
                            [worldState]="worldState()"
                            [players]="players()"
                            [currentUserId]="currentUserId()"
                            [mapCellsById]="mapCellsById()"
                            [environmentByCellId]="environmentByCellId()"
                        ></app-world-state-panel>
                    </div>
                </aside>

                <div class="map-wrapper">
                    <app-map-grid-panel
                        [mapSize]="mapSize()"
                        [mapCellsById]="mapCellsById()"
                        [players]="players()"
                        [activePlayerId]="worldState()?.activePlayerId ?? null"
                        [movableCellIds]="movableCellIds()"
                        [environmentByCellId]="environmentByCellId()"
                        (cellClicked)="onCellClick($event)"
                    ></app-map-grid-panel>
                </div>

                <aside class="hud stage-right-reserved">
                    <p class="hud-title">Right Panel</p>
                    <div class="panel-scroll-body"></div>
                </aside>
            </div>

            <div class="footer-actions">
                <icon-button
                    iconUrl="./icons/arrow_back_20dp_E3E3E3_FILL1_wght400_GRAD0_opsz20.svg"
                    ariaLabel="Back home"
                    (clicked)="onBackHome()"
                ></icon-button>
                <div class="footer-empty-space"></div>
                <app-resource-counter [resources]="myPlayer()?.inventory?.resources || []"></app-resource-counter>
                <app-money-counter [money]="myPlayer()?.inventory?.money || 0"></app-money-counter>
                <app-luck-indicator [result]="myPlayer()?.lastLuckCheck || null"></app-luck-indicator>
            </div>
        } @else {
            <div class="hud mobile-active-header">
                <p class="hud-title">Active Player</p>
                @if (activePlayer(); as active) {
                    <app-player-card [player]="active" [highlighted]="true"></app-player-card>
                } @else {
                    <p class="summary-item">No active player</p>
                }
            </div>

            <div class="mobile-map-wrapper">
                <app-map-grid-panel
                    [mapSize]="mapSize()"
                    [mapCellsById]="mapCellsById()"
                    [players]="players()"
                    [activePlayerId]="worldState()?.activePlayerId ?? null"
                    [movableCellIds]="movableCellIds()"
                    [environmentByCellId]="environmentByCellId()"
                    (cellClicked)="onCellClick($event)"
                ></app-map-grid-panel>
            </div>

            <app-map-mobile-controls
                [worldState]="worldState()"
                [players]="players()"
                [currentUserId]="currentUserId()"
                [mapCellsById]="mapCellsById()"
                [environmentByCellId]="environmentByCellId()"
                (backHome)="onBackHome()"
            ></app-map-mobile-controls>
        }
    </div>
</div>
