<app-combat-overlay></app-combat-overlay>
<app-exploration-phase-overlay></app-exploration-phase-overlay>
<div class="map-page-main-container">
    <app-required-action-notification
        [show]="isRequiredActionNotificationLockActive()"
        [title]="requiredActionNotificationTitle()"
        [description]="requiredActionNotificationDescription()"
        [players]="requiredActionNotificationPlayers()"
        [localPlayerId]="currentUserId()"
        [ownerPlayerId]="requiredActionNotification()?.ownerPlayerId ?? null"
        [allowOwnerOverride]="requiredActionNotificationOwnerOverrideVisible()"
        (acknowledgeRequested)="onAcknowledgeRequiredActionRequested($event)"
        (forceContinueRequested)="onForceContinueRequiredActionRequested()"
    ></app-required-action-notification>

    <div class="page-shell">
        <div class="hud hud-world world-header">
            <app-world-state-panel
                [worldState]="worldState()"
                [players]="players()"
                [mapCellsById]="mapCellsById()"
                [mapSize]="mapSize()"
                [totalSpecialCells]="4"
                [showTitle]="true"
                [title]="'map.worldTitle' | t"
                (worldEventHelpRequested)="onWorldEventHelpRequested()"
            ></app-world-state-panel>
        </div>

        <div class="map-stage">
            <aside class="stage-sidebar" [class.stage-sidebar-single-player]="isSinglePlayerSidebar()">
                <app-map-players-panel
                    [myPlayer]="myPlayer()"
                    [myPlayerComputedStats]="myPlayerComputedStats()"
                    [players]="players()"
                    [activePlayerId]="worldState()?.activePlayerId ?? null"
                    [pendingLevelUpChoices]="pendingLevelUpChoices()"
                    [canOpenLevelUpDialog]="canOpenLevelUpDialog()"
                    (openLevelUpRequested)="onOpenLevelUpDialog()"
                ></app-map-players-panel>

                <app-map-utilities-panel
                    class="sidebar-utilities-panel"
                    [commandActions]="commandActions()"
                    [spellActions]="spellActions()"
                    [spellCount]="spellCount()"
                    [spellCapacity]="spellCapacity()"
                    (commandActionRequested)="onCommandActionRequested($event)"
                    (spellActionRequested)="onSpellActionRequested($event)"
                ></app-map-utilities-panel>

                <app-luck-indicator class="sidebar-luck-meter" [result]="myPlayer()?.lastLuckCheck || null"></app-luck-indicator>
            </aside>

            <div class="map-wrapper">
                <div class="map-center-shell">
                    <section class="map-inline-hud map-time-block" [attr.aria-label]="'map.worldTime.ariaLabel' | t">
                        <div class="map-inline-hud-content map-time-content">
                            <span class="map-inline-hud-prefix">{{ 'map.worldTime.prefix' | t }}</span>
                            <app-day-night-cycle-panel class="map-inline-day-night" [worldState]="worldState()"></app-day-night-cycle-panel>
                        </div>
                    </section>

                    <app-map-grid-panel
                        [mapSize]="mapSize()"
                        [mapCellsById]="mapCellsById()"
                        [players]="players()"
                        [activePlayerId]="worldState()?.activePlayerId ?? null"
                        [movableCellIds]="movableCellIds()"
                        [tilesConfig]="tilesConfig()"
                        [regionIToIIWarning]="regionIToIIWarning()"
                        [sanctuaryStylesByElement]="sanctuaryStylesByElement()"
                        [environmentByCellId]="environmentByCellId()"
                        [showSpecialLocationLabels]="isSpecialLocationsCounterHovered()"
                        [worldEventMutationCellIds]="worldEventMutationCellIds()"
                        [worldEventPropagatedCellsCount]="worldEventPropagatedCellsCount()"
                        (cellClicked)="onCellClick($event)"
                        (cellContextMenuRequested)="onCellContextMenuRequested($event)"
                        (inspectedCellChanged)="onInspectionCellChanged($event)"
                    ></app-map-grid-panel>

                    <app-biomes-counter
                        class="map-floating-biomes-counter"
                        [worldState]="worldState()"
                        [mapCellsById]="mapCellsById()"
                        (specialCounterHoverChanged)="onSpecialLocationsCounterHoverChanged($event)"
                        (discardPileRequested)="openDiscardPileDialog()"
                    ></app-biomes-counter>

                    <app-map-location-discard-hud
                        [inspectedCell]="inspectedCell()"
                        [activePlayer]="activePlayer()"
                        [mapCellsById]="mapCellsById()"
                        (locationInfoRequested)="openLocationInfoDialog($event)"
                    ></app-map-location-discard-hud>
                </div>
            </div>

            <aside class="stage-right-utilities">
                <app-map-player-utilities-panel
                    [player]="myPlayer()"
                    (resourcePanelClicked)="onResourcePanelClicked()"
                ></app-map-player-utilities-panel>

            </aside>
        </div>

        <div class="footer-actions">
            <app-map-log-panel
                [latestMessage]="latestLogMessage()"
                (openLogsRequested)="openLogsDialog()"
            ></app-map-log-panel>
            <rulebook-button
                class="footer-rulebook-button"
                [ariaLabel]="'ui.rulebook.openAriaLabel' | t"
                (clicked)="openRulebookDialog()"
            ></rulebook-button>
            <icon-button
                class="footer-settings-button"
                iconUrl="./icons/settings_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg"
                [ariaLabel]="'map.actions.settings' | t"
                (clicked)="openMapSettingsDialog()"
            ></icon-button>
            <icon-button
                class="footer-home-button"
                iconUrl="./icons/home_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg"
                [ariaLabel]="'map.actions.home' | t"
                (clicked)="onBackHome()"
            ></icon-button>
        </div>
    </div>
</div>
